AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  aki-utils-lambda

  Sample SAM Template for aki-utils-lambda

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: python3.12

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - production
  WebHookUrl:
    Type: String
    Description: Discord webhook URL for posting othello board images
    NoEcho: true
  SteamWebHookUrl:
    Type: String
    Description: Discord webhook URL for posting Steam news
    NoEcho: true

Resources:
  # DynamoDB Table
  AkiUtilsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub aki-utils-${Environment}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: p_key
          AttributeType: S
        - AttributeName: s_key
          AttributeType: S
      KeySchema:
        - AttributeName: p_key
          KeyType: HASH
        - AttributeName: s_key
          KeyType: RANGE
  TumeOthelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/batch/tume-othello/
      Handler: app.lambda_handler
      Timeout: 100
      Environment:
        Variables:
          WEB_HOOK_URL: !Ref WebHookUrl
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: cron(15 23 * * ? *) # Every day at 9 AM JST
            Description: Daily batch processing
            Enabled: true

  SteamNewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/batch/steam-news/
      Handler: app.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref AkiUtilsTable
          STEAM_NEWS_WEBHOOK_URL: !Ref SteamWebHookUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AkiUtilsTable
      Events:
        ScheduleEvent06:
          Type: Schedule
          Properties:
            Schedule: cron(0 21 * * ? *) # Every day at 06:00 JST (21:00 UTC previous day)
            Description: Daily Steam news fetch at 06:00 JST
            Enabled: true
        ScheduleEvent12:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 * * ? *) # Every day at 12:00 JST (03:00 UTC)
            Description: Daily Steam news fetch at 12:00 JST
            Enabled: true
        ScheduleEvent18:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *) # Every day at 18:00 JST (09:00 UTC)
            Description: Daily Steam news fetch at 18:00 JST
            Enabled: true

  SteamNewsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/web_api/steam-news/
      Handler: app.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref AkiUtilsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AkiUtilsTable
      Events:
        RegisterAppId:
          Type: Api
          Properties:
            Path: /steam-news/appid
            Method: POST
        ListAppIds:
          Type: Api
          Properties:
            Path: /steam-news/appids
            Method: GET
        GetNews:
          Type: Api
          Properties:
            Path: /steam-news/news
            Method: GET

# API GatewayのURLを出力
Outputs:
  SteamNewsApiUrl:
    Description: "API Gateway URL for Steam News API"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/"
