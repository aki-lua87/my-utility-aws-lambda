[tools]
python = "3.12"

[env]
_.python.venv = { path = ".venv", create = true }
_.file = ".env"

[tasks.install]
description = "pip install -r requirements.txt"
run = "pip install -r requirements.dev.txt"

[tasks.dev]
description = "Start SAM local development server"
run = "sam local start-api --port 3000"

[tasks.build]
description = "Build SAM application"
run = "sam build --use-container"

[tasks.deploy]
description = "Deploy to AWS"
run = "sam deploy --config-env dev --parameter-overrides WebHookUrl=\"$WEB_HOOK_URL\" SteamWebHookUrl=\"$STEAM_NEWS_WEBHOOK_URL\" XzyWebHookUrl=\"$XZY_WEBHOOK_URL\""

[tasks.test]
description = "Run tests"
run = "python -m pytest tests/"

[tasks.lint]
description = "Run linting"
run = "ruff check ./src "

[tasks.format]
description = "Format code"
run = "ruff check ./src --fix"

[tasks.local-batch]
description = "Run batch function locally"
run = "sam local invoke BatchFunction"

[tasks.logs]
description = "Tail CloudWatch logs"
run = "sam logs -n WebApiFunction --stack-name aki-utils-lambda --tail"

[tasks.clean]
description = "Clean virtual environment and build artifacts"
run = [
    "rm -rf .venv",
    "rm -rf .aws-sam"
]

[tasks.exec-othello]
description = "Execute Othello batch function locally"
run = "sam local invoke TumeOthelloFunction --parameter-overrides WebHookUrl=\"$WEB_HOOK_URL\""

[tasks.exec-xzy-rank]
description = "Execute XZY Rank batch function locally"
run = "sam local invoke XzyRankFunction --parameter-overrides XzyWebHookUrl=\"$XZY_WEBHOOK_URL\""

[tasks.xzy-rank-image]
description = "Generate XZY ranking images locally"
run = "python src/batch/xzy-rank/test_local.py"
